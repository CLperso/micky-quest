name: carnet_micky
description: Carnet Micky, un bullet journal à décorer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  http: ^1.2.2
  image_picker: ^1.1.2
  google_mlkit_digital_ink_recognition: '>=0.11.0 <0.17.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/micky/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito_900Black.ttf
          weight: 900
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand_400Regular.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DancingScript_700Bold.ttf
          weight: 700
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond_500Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond_500Medium_Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CormorantGaramond_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond_600SemiBold_Italic.ttf
          weight: 600
          style: italic
