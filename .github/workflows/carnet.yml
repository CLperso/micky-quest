name: Carnet Micky

on:
  push:
    branches: [main]
    paths: ['carnet/**', '.github/workflows/carnet.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: carnet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Générer le projet
        run: |
          flutter create --org com.clperso --project-name carnet_micky --platforms android,web .
          python3 ci/patch_android.py
          sed -i 's#<title>.*</title>#<title>Carnet Micky</title>#' web/index.html
          sed -i 's#"name": "[^"]*"#"name": "Carnet Micky"#; s#"short_name": "[^"]*"#"short_name": "Carnet"#' web/manifest.json

      - name: Clé de signature stable
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 ci/annotate.py analyze.txt

      - name: Tests
        run: |
          flutter test > test.txt 2>&1 || true
          cat test.txt
          python3 ci/test_errors.py test.txt

      - name: Construire l'APK
        run: |
          set +e
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then python3 ci/build_errors.py build.txt; exit $code; fi
          cp build/app/outputs/flutter-apk/app-release.apk carnet-micky.apk

      - name: Construire la version PC (web)
        run: |
          set +e
          flutter build web --release --base-href /micky-quest/ > web.txt 2>&1
          code=$?
          cat web.txt
          if [ $code -ne 0 ]; then python3 ci/build_errors.py web.txt; exit $code; fi
          touch build/web/.nojekyll

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carnet-v1.0.${{ github.run_number }}
          name: Carnet Micky v1.0.${{ github.run_number }}
          body: "Télécharge carnet-micky.apk depuis la tablette pour l’installer ou le mettre à jour. Version PC sur https://clperso.github.io/micky-quest/"
          files: |
            carnet/carnet-micky.apk
          make_latest: false

      - name: Mettre en ligne la version PC
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: carnet/build/web
          publish_branch: gh-pages
