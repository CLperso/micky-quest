name: micky_quest
description: Organisation gamifiée avec Micky.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  android_intent_plus: '>=4.0.0 <7.0.0'
  device_calendar: ^4.3.3

# device_calendar demande timezone 0.9, flutter_local_notifications 0.10 : même API, on force la récente.
dependency_overrides:
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/objects/
